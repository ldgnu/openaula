name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Build static binaries
        run: |
          set -e
          mkdir -p dist
          for target in linux/amd64 linux/arm64 linux/arm linux/386; do
            os=${target%/*}; arch=${target#*/}
            out=openaula_${os}_${arch}
            echo "building $out"
            mkdir -p "dist/pkg"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "dist/pkg/openaula" ./cmd/openaula
            tar -C dist/pkg -czf "dist/$out.tar.gz" openaula
            rm -rf "dist/pkg"
          done
          # Tarball de dependencias para el ebuild de Gentoo (go mod vendor).
          go mod vendor
          tar -czf "dist/openaula-${GITHUB_REF_NAME#v}-vendor.tar.gz" vendor
          rm -rf vendor
          cd dist && sha256sum *.tar.gz > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
