name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Build static binaries
        run: |
          set -e
          mkdir -p dist
          for target in linux/amd64 linux/arm64 linux/arm linux/386; do
            os=${target%/*}; arch=${target#*/}
            out=openaula_${os}_${arch}
            echo "building $out"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "dist/$out" ./cmd/openaula
            tar -C dist -czf "dist/$out.tar.gz" "$out"
            rm "dist/$out"
          done
          cd dist && sha256sum *.tar.gz > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
